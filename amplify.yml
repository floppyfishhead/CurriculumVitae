version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm install --cache .npm --prefer-offline
        - chmod +x node_modules/.bin/vite

    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - "**/*"

  cache:
    paths:
      - .npm/**/*
